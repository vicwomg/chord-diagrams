services:
  - type: web
    name: chord-diagrams
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /vendor/*.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /*.css
        name: Content-Type
        value: text/css; charset=utf-8
      - path: /*
        name: Cache-Control
        value: no-cache
